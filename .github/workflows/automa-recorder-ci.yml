name: automa-recorder-ci

on:
  push:
    paths:
      - "automa-recorder/**"
      - ".github/workflows/automa-recorder-ci.yml"
  pull_request:
    paths:
      - "automa-recorder/**"
      - ".github/workflows/automa-recorder-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automa-recorder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automa-recorder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
